## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Mirrors HeyTune's proven flags for the AGP 9.2.1 + Kotlin 2.4.10 combo.
# android.builtInKotlin=false is load-bearing: since AGP 9.0 Kotlin ships
# built into AGP and applying the explicit 'org.jetbrains.kotlin.android'
# plugin FAILS the build unless this opts back out to the KGP plugin.

org.gradle.jvmargs=-Xmx4096M -Dkotlin.daemon.jvm.options\="-Xmx4096M"
android.useAndroidX=true
android.enableJetifier=true
org.gradle.unsafe.configuration-cache=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false
android.defaults.buildfeatures.resvalues=true
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
org.gradle.tooling.parallel=true
